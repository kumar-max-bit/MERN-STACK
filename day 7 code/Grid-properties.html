<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 50px;
        }

        #button-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        #button-container div {
            padding: 20px 30px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #button-container div:hover {
            background-color: #e0e0e0;
        }
        
        .operator {
            background-color: #ffb84d !important;
        }

        .clear {
            background-color: #ff4d4d !important;
            color: white;
        }

        .equal {
            background-color: #00ffcc !important;
        }

        .sci {
            background-color: #6c757d !important;
            color: white;
        }

        input {
            padding: 15px;
            font-size: 24px;
            text-align: right;
            border: 2px solid #ccc;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <div class="container">
        <div>
            <input type="text" id="display" readonly placeholder="0">
        </div>
        <div id="button-container">
            <div class="sci">sin</div>
            <div class="sci">cos</div>
            <div class="sci">tan</div>
            <div class="sci">π</div>
            <div class="sci">√</div>
            <div class="sci">x²</div>
            <div class="sci">(</div>
            <div class="sci">)</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div class="operator">/</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div class="operator">*</div>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div class="operator">-</div>
            <div class="clear">C</div>
            <div>0</div>
            <div class="equal">=</div>
            <div class="operator">+</div>
    </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        input.error-input {
            border-color: #e74c3c;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
            display: block;
            min-height: 16px; /* Prevents layout shifting when error appears */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2471a3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Register</h2>
        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <span class="error-msg" id="nameError"></span>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <!-- Type is text so we can rely strictly on our custom JS validation for the demo -->
                <input type="text" id="email" placeholder="Enter your email">
                <span class="error-msg" id="emailError"></span>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password">
                <span class="error-msg" id="passwordError"></span>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password">
                <span class="error-msg" id="confirmPasswordError"></span>
            </div>
            
            <button type="submit">Submit Registration</button>
        </form>
    </div>

    <!-- Load external JS or include it here -->
    <script>
        document.getElementById('registrationForm').addEventListener('submit', function(event) {
            // Prevent the default form submission
            event.preventDefault();

            // Clear previous errors
            document.querySelectorAll('.error-msg').forEach(el => el.innerText = '');
            document.querySelectorAll('input').forEach(el => el.classList.remove('error-input'));

            let isValid = true;

            // Get input values
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // 1. Check if name is empty
            if (name === '') {
                showError('name', 'Name cannot be left blank');
                isValid = false;
            }

            // 2. Email Validation: empty check AND format check (contains @ and .)
            if (email === '') {
                showError('email', 'Email cannot be left blank');
                isValid = false;
            } else if (!email.includes('@') || !email.includes('.')) {
                showError('email', 'Invalid email format (must contain @ and .)');
                isValid = false;
            }

            // 3. Check if password is empty
            if (password === '') {
                showError('password', 'Password cannot be left blank');
                isValid = false;
            }

            // 4. Confirm Password Validation: empty check AND match check
            if (confirmPassword === '') {
                showError('confirmPassword', 'Please confirm your password');
                isValid = false;
            } else if (password !== confirmPassword) {
                showError('confirmPassword', 'Passwords do not match');
                isValid = false;
            }

            // If all checks pass, "submit" the form
            if (isValid) {
                alert('Registration successful!');
                this.reset(); // Clear the form fields
            }
        });

        // Helper function to display errors
        function showError(inputId, message) {
            const inputElement = document.getElementById(inputId);
            const errorElement = document.getElementById(inputId + 'Error');
            
            inputElement.classList.add('error-input');
            errorElement.innerText = message;
        }
    </script>

</body>
</html>

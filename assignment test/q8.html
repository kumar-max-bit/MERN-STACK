<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API - User List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        /* Loading Message Styles */
        #loading-message {
            font-size: 18px;
            color: #2980b9;
            font-weight: bold;
            margin-top: 20px;
        }
        /* Grid Layout for Cards */
        .user-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        /* Individual Card Styles */
        .user-card {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            border-top: 4px solid #18bc9c;
        }
        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        .user-name {
            font-size: 20px;
            color: #333;
            margin: 0 0 10px 0;
        }
        .user-email {
            color: #7f8c8d;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>

    <h2>User Directory</h2>
    
    <!-- Loading text displayed initially -->
    <div id="loading-message">Fetching users... Please wait.</div>
    
    <!-- Container where user cards will be dynamically injected -->
    <div id="user-container" class="user-container"></div>

    <script>
        // The API endpoint
        const apiUrl = 'https://jsonplaceholder.typicode.com/users';

        // Fetch the data
        fetch(apiUrl)
            .then(response => response.json()) // Convert response to JSON
            .then(users => {
                // Hide loading message once data is fetched
                document.getElementById('loading-message').style.display = 'none';

                const container = document.getElementById('user-container');
                
                // Loop through the users array
                users.forEach(user => {
                    // Create a card dynamically
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    
                    // Insert Name and Email
                    card.innerHTML = `
                        <h3 class="user-name">${user.name}</h3>
                        <p class="user-email">📧 ${user.email}</p>
                    `;
                    
                    // Append the card to the container
                    container.appendChild(card);
                });
            })
            .catch(error => {
                // Handle any network errors
                document.getElementById('loading-message').innerText = 'Failed to load user data. Please try again.';
                document.getElementById('loading-message').style.color = '#e74c3c';
                console.error('Error fetching users:', error);
            });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <h1><b>Anchor Tag</b></h1>
    <a href="https://www.mail.com" target="_parent">click here to open mail</a>

    <h2>Alert message</h2>
    <a href="javascript:alert('Hello, World!')">Show Alert</a>

    <h2>Linking Mail</h2>
    <a href="mailto:user@example.com">Send Email</a>

    <h2>Confirmation message</h2>
    <a href="javascript:confirm('Are you sure you want to proceed?')">Confirm Action</a>

    <h1>input message</h1>
    <a href="javascript:prompt('Please enter your name:')">Prompt for Input</a>

    <h1>web pages</h1>
    <a href="https://www.google.com" target="_blank">Open Google in a new tab</a>

    <h1>download</h1>
    <a href="Profile.html" download="true">Download pdf</a>









    
</body>
</html>

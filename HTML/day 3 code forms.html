<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset style="background-color:powderblue; border-radius:10px; width:300px; margin:auto; padding:20px;">
            <legend align="center">login form</legend>
            <label for="username">Username</label>
            <input type="text"  required="username" placeholder="enter username"><br><br>
            <label for="password">Password</label>
            <input type="password" maxlength="7" minlength="4" name="password" placeholder="enter password"><br><br>
            <input type="submit" value="login">
            <button type="button">cancel</button>
        </fieldset>
    </form>
    
</body>
</html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       img[alt^="A"]{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid blueviolet;
        }
        h1[id$="tag"]{
            color: red;
        }
        h1[id|="heading"]{
            color: green;
        }
        h1[id*="h"]{
            color: blue;
        }
    </style>
</head>
<body>
    <h1 id="heading">Heading 1</h1>
    <h1 id="heading-tag">Headring 2</h1>
    <h1 id="heading-tag">Heading 2</h1>
    <h1 id="heading tag">Heading 3</h1>
